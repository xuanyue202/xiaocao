prompt = "Use the local `xiaocao-trading` skill and `automation-eod.md`. Run the canonical paper EOD workflow exactly once and wait for the original shell to terminate. Then run `PYTHONPATH=src .venv/bin/python scripts/book_b_live_intraday.py --date today --phase eod` exactly once without `--execute-sells`. The live branch is read/reconcile/settle only: fresh post-15:00 account-bound positions/orders/trades/positions-funds, broker-proved Book-B ownership, every durable plan terminal, and immutable settlement. Never create an order, treat UNKNOWN as terminal, rerun a top-level EOD process or use mixed broker totals as Book-B NAV. Report paper Book B, live Book B and Book T separately.\n\nAfter both business branches are terminal, run `PYTHONPATH=src .venv/bin/python scripts/kol_trading_decision.py feedback` once and perform the daily execution review from receipts, hashes, dated run artifacts and actual ledgers. KOL work is receipt/hash audit only: do not open report bodies, build a new semantic context, run `kol_trading_preparation.py status`, dispatch a semantic Agent or publish a KOL decision. Record missing source-decision-consumer links as unknown for the remote writer or next sparse owner; do not keep EOD alive to repair semantic support. A deterministic pricing, timing, all-lot coverage, global-open-plan, risk or allocation fault discovered through EOD belongs to this task's narrow repair path even when the broker order remains reconcile_only. Preserve rate limits, cache reuse, unrelated WIP and original historical receipts.\n\nA nonterminal or zero-fill owned SELL is a cross-checkpoint incident. Correlate exact order/trade/holding readback with its submission limit and time, contemporaneous bid if available, later trade prices, remaining auction window, other-lot evaluations, next-session available cash/owned-lot NAV/exposure/risk, and missing settlements. Distinguish external terminal uncertainty from separable code/config defects; a falling price is not cancel or resubmit authority. Own one narrow source/config repair after business processes terminate, validate and commit/push it, then verify at the next legal natural run. Do not close a repeated fingerprint by merely writing reconcile_only again. Check durable WeCom incident delivery separately from summary wording, and include a 5 Why, repair owner, prevention test and production verification status.\n\nReview anomalies from lower-level effects rather than trusting earlier agent final text: inspect the relevant task turns (including failed attempts and tool/command outputs), dated run archives, exact intent/event/ownership records, broker readback and subsequent checkpoints. A zero-fill SELL, repeated UNKNOWN, missing settlement, late or missing task turn, absent alert receipt, incomplete lot evaluation, or unchanged holdings with a blocked BUY is a trigger to drill down. Distinguish observed facts from inference, state what would falsify the cause, and carry the fingerprint until code repair, tests and natural-run readback are separately proven. If task trace is unavailable, report that gap."
