prompt = "Wake at 15:03 China wall-clock time to absorb the desktop scheduler dispatch jitter. Start the prescribed original command immediately after minimal instructions with a short tool yield; the code waits in bounded wall-clock chunks until 15:10 Asia/Shanghai before business actions/budgets/claims. Do not add a model-owned sleep, start a second process or change trading authority. Later calls retain the existing legality gates.\n\nUse the local `xiaocao-trading` skill and `automation-eod.md`. Run the canonical paper EOD workflow exactly once and wait for the original shell to terminate. Then run `PYTHONPATH=src .venv/bin/python scripts/book_b_live_intraday.py --date today --phase eod` exactly once without `--execute-sells`. The live branch is read/reconcile/settle only: fresh post-15:00 account-bound positions/orders/trades/positions-funds, broker-proved Book-B ownership and a complete structured eod_review. Under Operating Contract §4, a prior-day zero-fill owned SELL may close its economic confirmation task only with validated later independent full disposal and fresh same-account zero-position/no-contradiction proof. Its original UNKNOWN, no-replay claim and same-code BUY fence remain. Reevaluate each fresh snapshot and automatically reopen changed facts. Active economically relevant plans still block formal settlement; cash and itemized-fee finality remain required. Accounting-only gaps finish the read/reconcile workflow as observed/accounting_pending, while formal settlement and final PnL stay pending. Never create an order, treat UNKNOWN as terminal, rerun a top-level EOD process or use mixed broker totals as Book-B NAV. Report paper Book B, live Book B and Book T separately.\n\nAfter both business branches are terminal, run `PYTHONPATH=src .venv/bin/python scripts/kol_trading_decision.py feedback` once and perform the daily execution review from receipts, hashes, dated run artifacts and actual ledgers. KOL work is receipt/hash audit only: do not open report bodies, build a new semantic context, run `kol_trading_preparation.py status`, dispatch a semantic Agent or publish a KOL decision. Record missing source-decision-consumer links as unknown for the remote writer or next sparse owner; do not keep EOD alive to repair semantic support. A deterministic pricing, timing, all-lot coverage, global-open-plan, risk or allocation fault discovered through EOD belongs to this task's narrow repair path even when the broker order remains reconcile_only. Preserve rate limits, cache reuse, unrelated WIP and original historical receipts.\n\nAn active economically relevant nonterminal or zero-fill owned SELL is a cross-checkpoint incident. A proved economically_closed historical task stays in internal audit and does not repeat history queries or user alerts while facts remain unchanged. Correlate exact order/trade/holding readback with its submission limit and time, contemporaneous bid if available, later trade prices, remaining auction window, other-lot evaluations, next-session available cash/owned-lot NAV/exposure/risk, and missing settlements. Distinguish external terminal uncertainty from separable code/config defects; a falling price is not cancel or resubmit authority. Own one narrow source/config repair after business processes terminate, validate and commit/push it, then verify at the next legal natural run. Do not close a repeated fingerprint by merely writing reconcile_only again. Check durable WeCom incident delivery separately from summary wording, and include a 5 Why, repair owner, prevention test and production verification status.\n\nReview anomalies from lower-level effects rather than trusting earlier agent final text: inspect the relevant task turns (including failed attempts and tool/command outputs), dated run archives, exact intent/event/ownership records, broker readback and subsequent checkpoints. A zero-fill SELL, repeated UNKNOWN, missing settlement, late or missing task turn, absent alert receipt, incomplete lot evaluation, or unchanged holdings with a blocked BUY is a trigger to drill down. Distinguish observed facts from inference, state what would falsify the cause, and carry the fingerprint until code repair, tests and natural-run readback are separately proven. If task trace is unavailable, report that gap.\n\nTreat a prior-day UNKNOWN as an order-specific reconciliation issue. Review whether it blocked independent legal exits or next-morning BUY, and report any missing settlement precisely. After EOD business, retry durable pending trading WeCom notices and explicitly report any undelivered item. Order incidents and EOD/change notices use the shared durable delivery claim. Retry only proved pre-send failures; legacy pending, interrupted sends and uncertain or partial delivery require exact reconciliation and must not be resent.\n\nTask identity contract: this Automation ID is exactly xiaocao-daily-eod. Bind business commands to CODEX_AUTOMATION_ID=xiaocao-daily-eod and retain the runtime-supplied CODEX_THREAD_ID; compare against this task's initial scheduler header, and stop a mismatched entrypoint before effects. Do not infer identity or ownership from task title, shared project/cwd, Git branch, copied prompts or another automation's runner/receipt. Duplicate task/slot gates match only this exact Automation ID and include it in lock keys and owner evidence. Account/ledger/order resource guards keep their existing economic scope; never bypass them. A KOL peer gate may suppress only the KOL writer with the same ID. Time-critical first-command requirements remain in force; identity binding is an environment prefix on that existing command, not a new discovery step.\n\nAPP Book B capital/accounting: apply Operating Contract §6 and docs/BOOK_B_ACCOUNTING.md after the time-critical first command. All account-bound available cash is deployable; size with dynamic strategy NAV and existing ratios, with buy notional including fees capped by fresh available cash. Consume account.accounting and its exact observation/journal/funding hashes from the shared accounting.sqlite3; report marked NAV, contributed capital, realized/unrealized PnL and separate estimated-exit-fee/risk NAV. Unclassified cash stays pending and total PnL is N/A; never infer capital from balance differences or reset high water/pause. Keep original order evidence, manual holdings and paper A/B/T separate. Routine tasks never classify new capital, mint authorization, resize existing intents or replace a runner.\n\nAfter the original business process terminates, run PYTHONPATH=src .venv/bin/python scripts/book_b_accounting.py statement once under this task identity; read its exact report_path/details_path and retain dated/stale/unknown status. This export makes no APP query and never closes an unresolved order.\n\nEOD account evidence retention: the original archive keeps broker_snapshot with the exact normalized positions/orders/trades, positions-funds summary, original clocks and snapshot hash used by the projection. Follow the compact broker_snapshot_evidence archive reference when auditing CLI output. A historical receipt without that snapshot remains an evidence gap; never reconstruct, overwrite or rerun it from a later APP read.\n\nThe paper EOD status digest uses the shared durable delivery claim in output/live/paper_eod_status_notices.jsonl. Include this outbox in post-business safe retries using scripts/trading_change_notice.py --outbox output/live/paper_eod_status_notices.jsonl --retry-pending. Never replay status.py --push-wecom to recover uncertain delivery; retain historical direct-send logs as an evidence gap. After business terminals, include output/live/sell_result_notices.jsonl in the shared durable safe retry with scripts/trading_change_notice.py --outbox output/live/sell_result_notices.jsonl --retry-pending; report exact pending delivery and never replay a trade to recover its notice.\n\nAPP actual-fee reconciliation: estimated_plan_rate is provisional only. Final realized/unrealized/cumulative profit remains N/A until actual itemized native fees cover every exact owned order. A matching cash balance or small-delta tolerance does not prove actual fees or permit formal settlement. Consume fee_status/pending_fee_orders and accepted append-only fee differences from the shared journal; never infer fees from the cash gap or rewrite historical postings. Native fee collection is currently unavailable: retain exact missing order identities for the next evidence owner, without replaying EOD, changing allocation/risk authority or fabricating a fee receipt.\n\nPost-business closeout follows docs/reviews/2026-10-19-eod-closeout.md. Verify the actual next legal natural archive snapshot and durable notification claims, and retain exact missing fee/order/settlement/delivery evidence. A configured next owner is not proof of its run; KOL remains receipt/hash audit only.\n\nUser clarification 2026-10-19: the exact eight historical notification claims retired_by_user are no longer actionable delivery gaps. Respect their separate retirement records, exclude them from retries and recurring pending summaries, and preserve original uncertain receipts without relabeling delivered. This waiver changes no order, settlement, fee or capital authority; new notices remain governed by normal durable delivery.\n\nUser authorization 2026-10-21: fix all three EOD defects without repeated confirmation. Consume the evidence-driven historical economic task closure in Operating Contract §4 and automation-eod.md; original broker status stays untouched. Surface all execution, cash and actual-fee blockers together in eod_review rather than only the first exception. Alert by stable economic incident identity across date/run/clock changes; preserve legacy delivered/uncertain claims, keep unchanged historical and routine accounting gaps local, and notify on current execution impact, meaningful state change or a concrete user action. After a terminated pre-review-schema original EOD, scripts/book_b_eod_review.py --receipt <exact original archive> may derive one dated hash-bound review under that original owner, with no APP query, new order, formal settlement, EOD/feedback/statement replay. New natural EOD runs create their own reviews and revalidate closure; configured code or owner is not natural-run proof.\n\n2026-10-22 approved unified APP B lifecycle: follow docs/BOOK_B_WORKFLOW.md. Retain APP E selection, the COLD default gate, B staged exits, current capital/risk and exact-once authority. Final-plan, execution and accounting receipts are separate. The independent app-b-forward-funded-v1 control and three pre-registered M/open-limit/no-KOL challenges are authority=0, each with its own 100,000 model-yuan cash/lots and future-window fills; model returns never establish APP fills or profit. Missing raw symbol/date/window/fee/mark evidence remains unknown. Canonical Paper A/B/T and the Book A sensor remain separate; no strategy promotion without research_run and the human gate.\nThe paper EOD shell does not acquire funded research before APP reconciliation. After the original paper EOD, APP EOD and statement readback finish, the same EOD owner runs PYTHONPATH=src .venv/bin/python scripts/research_book_b_forward.py --phase eod once. This advances funded EOD marks and refreshes both performance and the read-only APP lifecycle report; do not add a second report invocation. Preserve actual versus estimated fees/profit and historical evidence locally; this report never grants settlement authority.\n\nNative read failure evidence: follow the blocked receipt native_readback_evidence path and SHA-256 into runs/intraday/read_failures. Those retained redacted cells are diagnostic_only and are not a validated broker snapshot, fill, retry, BUY/NAV or settlement permission. A native_readback_evidence_error preserves the original failure and identifies a separate evidence-storage gap. Use references/book-b-live-repair.md; do not re-query an expired checkpoint to recreate its original cells.\n\n2026-10-26 用户通知偏好：企微盘后摘要把 APP 模拟 Book B 盈亏放在最上面，纸面 B/A/T 随后分列。按 automation-eod.md 的摘要口径，只读已校验的最新 SQLite 账务观测，注明北京时间观测时点；原纸面摘要发送时点早于 APP EOD，不冒称新鲜 APP EOD 或正式结算。现金归属或逐笔实际费用未齐时，累计正式盈亏为待核，另列账务暂估的已实现/浮动盈亏、策略标记净值、净投入及待核项。缺失、过期或无效证据显示待更新。此展示变更只用于后续自然运行，不重发已送达的当日摘要。"
