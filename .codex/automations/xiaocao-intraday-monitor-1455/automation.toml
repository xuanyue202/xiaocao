prompt = "Wake at 14:38 China wall-clock time to absorb the desktop scheduler dispatch jitter. Start the prescribed original command immediately after minimal instructions with a short tool yield; the code waits in bounded wall-clock chunks until 14:45 Asia/Shanghai before business actions/budgets/claims. Do not add a model-owned sleep, start a second process or change trading authority. Later calls retain the existing legality gates.\n\nTIME-CRITICAL 14:38 PREWAKE FOR THE 14:45 CLOSE. Use `xiaocao-trading`. After one brief skill-use commentary, the first shell tool call must be `bash scripts/book_b_live_closing_startup.sh`; do not plan, inspect, delegate or wait in the model first. The launcher reads the required memory/skill references, waits from any same-day early arrival in chunks of at most 60 seconds until 14:45, and runs `PYTHONPATH=src .venv/bin/python scripts/book_b_live_intraday.py --date today --phase closing --execute-sells` exactly once at the legal gate without a model round-trip. The same retained launcher then runs `PYTHONPATH=src .venv/bin/python scripts/live_monitor.py --execute-sells` exactly once immediately after the APP branch, even if APP returns nonzero, and prints both exit codes. Retain the original launcher until both branches terminate; do not invoke either monitor separately or restart the launcher. Reconcile live and paper separately. Preserve the 14:45:00-14:56:59 authority, best-bid-aware aggressive SELL limit, account/owned-lot/T+1/liquidity/capital-key/durable-claim/UNKNOWN-no-retry rules, deferred BUY ownership and same-plan repair. Never replay an expired close.\n\nUse only a KOL decision already validated before this closing task through the normal consumers. Do not retrieve KOL context, read KOL report bodies, run `kol_trading_preparation.py status`, dispatch a semantic Agent, refresh sources or publish a KOL decision before or after the close. KOL/source gaps are supporting degradation for the next source/sparse owner and must not extend this task. After both branches terminate, perform bounded receipt/ledger reconciliation. A non-normal live result owns urgent exact repair and narrow durable-state continuation, followed by scoped regression and cause/fix/verification; broker uncertainty remains reconcile-only.\n\nRepair priority (2026-09-27): prioritize each legal SELL window and the 09:25–09:30 BUY path. Normal readback uses full APP tables; treat an old prior-day UNKNOWN as its own reconciliation claim. Current account-bound APP sellable and a new dated owned-lot intent may permit a separate SELL, while independent lots continue. The dedicated sellable-only port is implemented and covered by offline and account-bound read-only acceptance. Use it only for the classified read failures and same-account/date/owned-lot/T+1/current-sellable gates in BOOK_B_WORKFLOW.md; it supplies no cash/NAV or EOD authority. Natural nonzero-lot/order acceptance remains unproved until observed; repair an actual failure, not an assumed missing port. After business, retry durable pending trading WeCom notices.\n\nTask identity contract: this Automation ID is exactly xiaocao-intraday-monitor-1455. Bind business commands to CODEX_AUTOMATION_ID=xiaocao-intraday-monitor-1455 and retain the runtime-supplied CODEX_THREAD_ID; compare against this task's initial scheduler header, and stop a mismatched entrypoint before effects. Do not infer identity or ownership from task title, shared project/cwd, Git branch, copied prompts or another automation's runner/receipt. Duplicate task/slot gates match only this exact Automation ID and include it in lock keys and owner evidence. Account/ledger/order resource guards keep their existing economic scope; never bypass them. A KOL peer gate may suppress only the KOL writer with the same ID. Time-critical first-command requirements remain in force; identity binding is an environment prefix on that existing command, not a new discovery step.\n\nAPP Book B capital/accounting: apply Operating Contract §6 and docs/BOOK_B_ACCOUNTING.md after the time-critical first command. All account-bound available cash is deployable; size with dynamic strategy NAV and existing ratios, with buy notional including fees capped by fresh available cash. Consume account.accounting and its exact observation/journal/funding hashes from the shared accounting.sqlite3; report marked NAV, contributed capital, realized/unrealized PnL and separate estimated-exit-fee/risk NAV. Unclassified cash stays pending and total PnL is N/A; never infer capital from balance differences or reset high water/pause. Keep original order evidence, manual holdings and paper A/B/T separate. Routine tasks never classify new capital, mint authorization, resize existing intents or replace a runner.\n\nNon-trading-day discipline: keep the same first launcher and paper command exactly once. The APP CLI must prove the exchange calendar before credentials, native tables or old-order reconciliation; NON_TRADING_DAY is a normal durable skip and calendar uncertainty blocks before APP access. Do not replay the close, refresh account/NAV or initiate historical reconciliation on a holiday; preserve existing claims and report current valuation unavailable when no fresh account observation was obtained.\n\n2026-10-22 approved unified APP B lifecycle: follow docs/BOOK_B_WORKFLOW.md. Retain APP E selection, the COLD default gate, B staged exits, current capital/risk and exact-once authority. Final-plan, execution and accounting receipts are separate. The independent app-b-forward-funded-v1 control and three pre-registered M/open-limit/no-KOL challenges are authority=0, each with its own 100,000 model-yuan cash/lots and future-window fills; model returns never establish APP fills or profit. Missing raw symbol/date/window/fee/mark evidence remains unknown. Canonical Paper A/B/T and the Book A sensor remain separate; no strategy promotion without research_run and the human gate.\nThe existing closing startup launcher advances funded research after both production branches. Do not add a second call. Consume original APP claimed-SELL progress/terminal receipts within its persisted 120-second preparation/readback budget capped at 14:57. ACK/PARTIAL/UNKNOWN remain pending; no second runner, replacement, cancel or submit replay.\nThe original launcher binds research --checkpoint-phase closing. Preserve that phase when late; only closing may model soft exits."
