prompt = "Use the local xiaocao-trading skill and read automation-morning.md, kol-trading-judgment.md, book-b-live-repair.md and Operating Contract §1a/§1b/§1c/§2a. Book B uses APP-server simulation with formal order, exact-once and accounting discipline; paper ledgers stay separate.\n\nAt 09:00 China time start exactly one original runner with short yield: PYTHONPATH=src .venv/bin/python scripts/book_b_live_morning.py --date today --route native-app. Retain its default quiet freeze wait and run one authentication-only market-data probe. At 09:00 also run PYTHONPATH=src .venv/bin/python scripts/morning_preflight_alert.py --date today --kind transport once; this read-only check proves trading WeCom configuration, not delivery. On MARKET_LOGIN_CAPTCHA_REQUIRED, keep the original runner waiting and immediately start PYTHONPATH=src .venv/bin/python scripts/configure_market_data_auth.py --captcha-from-keychain in a PTY with short yield. It emits a temporary captcha_image_path and waits up to 120 seconds. Read the image with view_image, enlarge locally if ambiguous, then send one visually verified code through write_stdin; OCR is advisory only. The script uses saved Keychain credentials and the same HTTP session for challenge and login, and deletes the image. Do not ask the user to solve the image, expose credentials, or retry a rejected login. After successful Keychain readback, run one fresh-process authentication probe. If the final auth check remains blocked, run scripts/morning_preflight_alert.py --date today --kind market-auth once for a dated urgent WeCom incident and report delivery status. If the original runner ends blocked at preflight, run that alert script with --kind book-b --receipt <its exact terminal receipt_path> as soon as the blocked receipt is durable, then continue bounded local repair. Keep the original runner and its freeze wait alive while recovering market auth; accept only a valid immutable producer freeze. Missing saved credentials, SMS/consent or an unproved login remains a reported blocker. Never equate WeCom relay delivery with human acknowledgement. The 09:23 producer owns the immutable freeze; never start or wait for paper morning-execute. Treat runner stage JSON as the event source: do not model-poll, repeatedly call write_stdin, or print unchanged state before an emitted event or the 09:24 recovery boundary. Read brief_path first and select fields from immutable artifacts only when an event requires action.\n\nLiangHui viewpoint, viewpoint_evaluation and viewpoint_relation records are the sole KOL semantic SSOT. Build the cache-only, 11:30-horizon capsule with PYTHONPATH=src .venv/bin/python scripts/kol_trading_context.py projection --cache-only --history-fresh-through <today>T11:30:00+08:00. Consume its projection_path/projection_sha256/source_fingerprint/counts directly; use only a changed source_fingerprint as a semantic-change signal. Use every active_viewpoint that independently passes the typed, still-valid Book-B short-term standard; there is no fixed count or latest-N cutoff. Uncertain, non-short, unclassified and incomplete views are counts only. Never open classification_backfill or infer scope from keywords, holdings, asset names or latest-N. Do not run source preparation, create a second source summary, or reopen unchanged report bodies. Missing or degraded longitudinal coverage is a remote-writer quality issue and degrades to the deterministic baseline. At the freeze, one bounded current-applicability review may combine this compact projection with exact freeze, account, risk and current facts; formal publication loads only the cited exact report bodies for verification. Never extend freshness, backdate or force neutral.\n\nAttempt a guarded native unlock only when the credential source and remaining-attempt evidence are safe. The helper must clear and prove the secure field empty before replacement, submit once, and persist only sanitized credential health or failure category plus remaining attempts. Any unproved result is terminal for that attempt. Normal new BUY uses scoped available cash and current proved Book-B lots. If the settlement ownership head advanced after proved fills, replay the owned fills and mark them with today's account-bound APP positions; use the lower settled/current NAV and higher settled/current exposure. A prior-day zero-fill SELL stays reconcile-only with exact fresh proof, while a new BUY in that SELL's code is blocked before intent binding. Keep one bounded batch preflight and per-order guards. Preserve account, cash, price, quantity, market/strategy guard, duplicate tuple, durable claim and unique counter ACK. Continue after each chain-certain ACK/PARTIAL; UNKNOWN is reconcile-only.\n\nBefore any engineering APP test command, run PYTHONPATH=src .venv/bin/python scripts/app_test_window_status.py. A closed result defers tests without pytest collection; it never affects production repair or reconciliation. On faults follow book-b-live-repair.md and narrow-resume only the original durable plan. Keep operator output compact: status/count/hash/path, brief fields and exact terminal orders only; full candidates, account tables, source caches and payloads stay in artifacts. Report terminal orders/fills/UNKNOWN, Book-B cash/NAV, supporting degradation and preflight/ACK/reconciliation durations. Record cause, repair, validation and deployment SHA in Automation memory.\n\nOn a blocked result, follow book-b-live-repair.md through local repair and exact-plan readback before closeout. Inspect pending_orders and incident_notifications in the terminal notice; report the exact existing WeCom delivery time/status, never equate no new orders with no alert. Prior-day reconciliation refreshes historical queries but cannot infer cancellation from age, zero trades or unchanged holdings. Record any irreducible external terminal-evidence gap explicitly; a written next-owner note is not an accepted handoff.\n\nTask isolation and trading WeCom milestones: the runner owns the task-local automation ID xiaocao-book-b-live-morning and dated runner lock. Never use a remote-writer peer gate/ownership to suppress this task; report actual lock owner and exact failure. The runner durably queues preflight-start, native APP preflight-ready and opening-result WeCom notices automatically. Send failure causes on any blocked/failed result and exact order/fill results on success or no-action; early preflight blockage must explicitly say opening execution was not reached. Ready is native session/account evidence, not action-time quote/capital authority. Delivery runs asynchronously while trading; read the emitted book_b_wecom_delivery proof. After business work run PYTHONPATH=src .venv/bin/python scripts/morning_trade_notice.py --retry-pending once and report delivery time/status or remaining uncertainty. This retries only proven pre-send failures; never resend delivered recipients or uncertain claims automatically. --receipt <exact terminal receipt> sends only evidence and never restarts the trade. Never fabricate ready or a retrospective start.\n\nIf the original runner remains active at 09:30 without terminal proof, its built-in notification timer sends an explicit pending/unproved golden-window result without APP polling or stopping recovery; it sends the actual terminal result later. Read the dated delivery receipts and do not infer zero orders/fills from missing terminal evidence.\n\nTask identity contract: this Automation ID is exactly xiaocao-book-b-live-morning. Bind business commands to CODEX_AUTOMATION_ID=xiaocao-book-b-live-morning and retain the runtime-supplied CODEX_THREAD_ID; compare against this task's initial scheduler header, and stop a mismatched entrypoint before effects. Do not infer identity or ownership from task title, shared project/cwd, Git branch, copied prompts or another automation's runner/receipt. Duplicate task/slot gates match only this exact Automation ID and include it in lock keys and