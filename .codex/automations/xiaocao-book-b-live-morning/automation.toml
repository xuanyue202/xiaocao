prompt = "Use the local xiaocao-trading skill and references/automation-morning.md, kol-trading-judgment.md, kol-source-preparation.md plus Operating Contract §1a/§1b/§1c/§2a. Book B runs APP-server simulation with formal order and accounting discipline; paper ledgers remain separate.\n\nAt 09:00 China time immediately start exactly one original runner with short yield: PYTHONPATH=src .venv/bin/python scripts/book_b_live_morning.py --date today --route native-app. Retain it and its default freeze wait. Run one lightweight market_data_preflight.py --date today --scope authentication probe; explicit 990502 uses official Keychain-backed recovery without logging credentials. Empty success is neither authentication failure nor complete data. The 09:23 producer owns the immutable freeze; do not start another producer or morning-execute.\n\nPrepare source reasoning immediately. Use kol_trading_context.py context --summary --cache-only --history-fresh-through <today>T11:30:00+08:00 and kol_trading_preparation.py status --context <path> --ready-through <today>T11:30:00+08:00. Repair only exact missing/expired IDs in bounded batches, preserving the same horizon and actual TTL. Unchanged source hashes reuse reviewed notes; cache revalidation is not a reason to repeat semantic analysis. Never claim unread historical bodies were read. Only the remote source writer may extract or publish source objects.\n\nStart one retained gpt-6-astra xhigh semantic worker early under the skill; parent independently reviews. By 09:20 produce a complete conditional opening draft: non-null scale and reasons, invalidation conditions, opening scenarios, source fingerprint and independent hash-bound source review. Check status again with --opening-draft <path>; source prepared alone or an empty template is not precomputation_complete. Keep current applicability distinct from source reasoning. If current facts already justify a policy, publish through kol_trading_decision.py with its justified validity; never extend yesterday's policy or force neutral to pass readiness. Save a compact checkpoint with runner/worker handles, context/draft/hash paths, exact gaps and next deadline by 09:20. Near 09:22 refresh selected manifests only and read complete changed evidence; use lossless delta only after actual full base reading. Keep all expensive reading out of the opening window.\n\nAfter initial native preflight leave the APP untouched until 09:24; the original runner owns sleep and session recovery. Resume active runner polling by 09:24:50, with no duplicate keepalive or account probes. Read compact stdout notices and review brief paths; full requests, tables and logs stay on disk and are opened only for a specific missing fact. Avoid repeated manuals, broad code searches and full context rebuilds during 09:24–09:30. Client compaction cannot be disabled; control input volume and preserve resumable state early.\n\nAt freeze reuse a valid applicable policy or finish only current applicability with the retained worker and independent parent review. Use the exact immutable request, candidate brief, bound account/risk evidence and actual notice deadline. Review is at most 120 seconds and capped at 09:27 before opening; after a delayed authorized retry use its actual deadline, not the 11:30 entry horizon. Never restart source work or publish a late draft to rewrite a fallback. Keep unmet coverage and neutral fallback degradation explicit.\n\nNormal new BUY uses scoped available cash and owned Book-B lot marks, settled capital/ownership evidence, one bounded batch preflight and per-order guards. Unrelated orders may exist. Verify complete row structure and code/order-ID identity plus relevant exact tuples; unrelated status/valuation, full trade history and cancellation navigation do not gate a new BUY. Do not add a prepare-and-clear rehearsal; actual submit prepares and reads back each order once. Preserve current account, cash, price, quantity, strategy/market guard, duplicate tuple, durable claim and unique counter ACK. Advance to the next reserved plan after chain-certain ACK/PARTIAL without waiting for fills or full account reads. Batch reuse expires after 60 seconds; ambiguous notice invalidates it. UNKNOWN is reconcile-only. SELL, cancellation, existing-claim recovery and post-submit/EOD audits retain strict full evidence. Buying-power proof is never settlement proof.\n\nTarget all approved unique counter ACKs before 09:28 and require before 09:30. Missing targets are timing failures, not automatic skips or grounds to chase a price guard. On faults follow book-b-live-repair.md: minimal relevant repair and validation, then exact same-plan continuation. --resume-plan-id and recovery-action apply only to the original durable plan; never replay uncertain or terminal writes or reallocate old intents. Finish pending exact-order reconciliation and terminal handoff. Leave unrelated test orders to their owning task. Engineering APP tests are forbidden weekdays 09:00–15:00; formal necessary repairs follow the contract.\n\nAfter continuous submission reconcile exact orders/fills/owned holdings and account changes. FILLED plus safely SKIPPED is a terminal batch; UNKNOWN remains unresolved. Keep actual fees, configured fee projections, mixed broker cash and Book-B NAV distinct. Report concise Chinese terminal outcome, missing timing targets and actual stage durations; two fast ACKs do not prove a fast whole run. Record cause, root repair, checks, deployment SHA and remaining natural-opening acceptance in Automation memory. Do not claim code compilation or skipped APP tests as live behavior validation."
