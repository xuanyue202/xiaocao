prompt = "Wake at 08:53 China wall-clock time to absorb the desktop scheduler dispatch jitter. Start the prescribed original command immediately after minimal instructions with a short tool yield; the code waits in bounded wall-clock chunks until 09:00 Asia/Shanghai before business actions/budgets/claims. Do not add a model-owned sleep, start a second process or change trading authority. Later calls retain the existing legality gates.\n\nCredential recovery is owned by the current task. With saved Keychain credentials, handle routine image CAPTCHA and exactly proved pre-secret stale APP dialogs locally without asking the user. Market recovery uses scripts/configure_market_data_auth.py --captcha-from-keychain with a retained PTY, view_image and hidden code input, one lock across challenge fetch/login/readback, and a fresh-process authentication probe. Only explicit CAPTCHA rejection allows up to three fresh challenge images; password/account rejection, missing credentials, SMS/consent and uncertain actions remain distinct blockers. Keep the original producer process alive on market_dependency_recovery_wait; restore its next read, never launch another producer. Never print secrets. APP no-action dependency retries keep the original preparation deadline and confirmed/uncertain password fences.\n\nMandatory post-change review: apply AGENTS.md and the code-review skill to every code change after business work, using independent Standards and Spec reviewers against a pinned baseline and scoped diff. In the golden09:25–09:30 window, repair necessary dependencies, validate order correctness and continue the original trade first; run review after terminal or exact unresolved-order readback, The implementing agent must assess each finding from first principles, fix demonstrated problems, validate and re-review before declaring the repair complete. Never leave actionable review findings as a user backlog; escalate only irreducible permission, external-evidence gaps or user decisions. Code review does not replace deferred APP regression or execution proof.\n\nTrading-day gate precedes all business work: before starting the original runner or any market/APP/KOL preflight, run CODEX_AUTOMATION_ID=xiaocao-book-b-live-morning PYTHONPATH=src .venv/bin/python -m xiaocao calendar latest --date today once. If the latest trading date differs from today, finish as NON_TRADING_DAY immediately, with no APP actions, KOL projection, freeze wait, order reconciliation, notification retry or trading WeCom alert. Calendar failure or empty/unproved data must stop before APP work and remain explicit; never infer a trading day from weekday scheduling. The runner independently enforces the same API calendar gate before native preflight and notices. This gate overrides the old time-critical runner-first wording on a non-trading day.\n\nTrading WeCom policy: routine preflight-start, ready and recoverable preflight-problem milestones are local audit records only. Send an immediate notice only for an explicit user-only dependency; otherwise use one consolidated opening result covering cause, current orders/fills and historical pending orders. Unchanged same-day recovery results are deduplicated; the book-b receipt alert reuses the runner result delivery claim rather than sending a second message. Native order incidents remain durable locally and are included in the morning summary instead of sending separate messages per order. A genuinely pending 09:30 result may notify once, followed by its changed terminal outcome. Write plain Chinese: result, reason, whether the user needs to act; keep exact order numbers but leave plan hashes, paths and technical diagnostics in Codex artifacts. Do not send routine holiday messages or resend an uncertain claim.\n\nUse the local xiaocao-trading skill and read automation-morning.md, kol-trading-judgment.md, book-b-live-repair.md and Operating Contract §1a/§1b/§1c/§2a. Book B uses APP-server simulation with formal order, exact-once and accounting discipline; paper ledgers stay separate.\n\nInvocation ownership comes first: the 09:00 runner instruction applies only to a fresh scheduler-created turn for today's slot. A human follow-up in an older Automation task is repair/inspection-only by default, even if it has the same Automation ID, it reaches 09:00, or its earlier prompt said to run the morning flow. It must not start today's runner, perform today's market/APP/KOL preflight, or claim today's trading ownership unless the user explicitly transfers that ownership and the current dated owner is reconciled. The scheduled task owns the complete runner stdout, review rendezvous, business decisions, receipts and notices. If its runner entrypoint returns SAME_AUTOMATION_RUNNING, report the exact lock owner and stop this duplicate task's business work immediately: no extra probes, projections, APP actions, order recovery, or cross-task status relay. The existing owner continues; a separate repair task changes code in isolation and supplies a precise fix only when requested. Do not transfer a live runner through chat or assume an exec session ID is shareable between tasks. During 09:25–09:30, avoid peer messaging unless a concrete dependency_recovery_wait or exact failure requires one bounded repair handoff.\n\nAt the08:53 prewake start exactly one original runner with short yield; its code gates APP preparation at09:00: CODEX_AUTOMATION_ID=xiaocao-book-b-live-morning PYTHONPATH=src .venv/bin/python scripts/book_b_live_morning.py --date today --route native-app. Retain its default quiet freeze wait and run one authentication-only market-data probe. At 09:00 also run PYTHONPATH=src .venv/bin/python scripts/morning_preflight_alert.py --date today --kind transport once; this read-only check proves trading WeCom configuration, not delivery. On MARKET_LOGIN_CAPTCHA_REQUIRED, keep the original runner waiting and immediately start PYTHONPATH=src .venv/bin/python scripts/configure_market_data_auth.py --captcha-from-keychain in a PTY with short yield. It emits a temporary captcha_image_path and waits up to 120 seconds. Read the image with view_image, enlarge locally if ambiguous, then send one visually verified code through write_stdin; OCR is advisory only. The script uses saved Keychain credentials and the same HTTP session for challenge and login, and deletes the image. Handle image recognition locally without exposing credentials. Only explicit CAPTCHA rejection permits up to three fresh challenges; rejected password/account and uncertain login actions remain durably fenced. After successful Keychain readback, run one fresh-process authentication probe. If the final auth check remains blocked, run scripts/morning_preflight_alert.py --date today --kind market-auth once for a dated urgent WeCom incident and report delivery status. If the original runner ends blocked at preflight, run that alert script with --kind book-b --receipt <its exact terminal receipt_path> as soon as the blocked receipt is durable, then continue bounded local repair. Keep the original runner and its freeze wait alive while recovering market auth; accept only a valid immutable producer freeze. Missing saved credentials, SMS/consent or an unproved login remains a reported blocker. Never equate WeCom relay delivery with human acknowledgement. The 09:25:01 producer owns the immutable freeze; never start or wait for paper morning-execute. Treat runner stage JSON as the event source: do not model-poll, repeatedly call write_stdin, or print unchanged state before an emitted event or the 09:24 recovery boundary. Read brief_path first and select fields from immutable artifacts only when an event requires action.\n\nLiangHui viewpoint, viewpoint_evaluation and viewpoint_relation records are the sole KOL semantic SSOT. Build the cache-only, 11:30-horizon capsule with PYTHONPATH=src .venv/bin/python scripts/kol_trading_context.py projection --cache-only --history-fresh-through <today>T11:30:00+08:00. Consume its projection_path/projection_sha256/source_fingerprint/counts directly; use only a changed source_fingerprint as a semantic-change signal. Use every active_viewpoint that independently passes the typed, still-valid Book-B short-term standard; there is no fixed count or latest-N cutoff. Uncertain, non-short, unclassified and incomplete views are counts only. Never open classification_backfill or infer scope from keywords, holdings, asset names or latest-N. Do not run source preparation, create a second source summary, or reopen unchanged report bodies. Missing or degraded longitudinal coverage is a remote-writer quality issue and degrades to the deterministic baseline. At the freeze, one bounded current-applicability review may combine this compact projection with exact freeze, account, risk and current facts; formal publication loads only the cited exact report bodies for verification. Never extend freshness, backdate or force neutral.\n\nAttempt a guarded native unlock only with a readable account-bound fixed Keychain credential, a clear dialog check, and durable health that has no rejected or unproved attempt. A prior successful account-bound unlock whose UI exposed no remaining-attempt counter leaves that count unknown; the missing counter alone must not trigger manual-unlock escalation. Claim the one attempt before the helper acts, preserve the unknown count, and never retry a rejected, unproved or interrupted attempt. The helper must clear and prove the secure field empty before replacement, submit once, and persist only sanitized credential health or failure category plus remaining attempts. Any unproved result is terminal for that attempt. Normal new BUY uses scoped available cash and current proved Book-B lots. If the settlement ownership head advanced after proved fills, replay the owned fills and mark them with today's account-bound APP positions; use the approved dynamic strategy NAV and current owned exposure under Contract §6. A prior-day zero-fill SELL stays reconcile-only with exact fresh proof, while a new BUY in that SELL's code is blocked before intent binding. Keep one bounded batch preflight and per-order guards. Preserve account, cash, price, quantity, market/strategy guard, duplicate tuple, durable claim and unique counter ACK. Continue after each chain-certain ACK/PARTIAL; UNKNOWN is reconcile-only.\n\nBefore any engineering APP test command, run PYTHONPATH=src .venv/bin/python scripts/app_test_window_status.py. A closed result defers tests without pytest collection; it never affects production repair or reconciliation. On faults follow book-b-live-repair.md and narrow-resume only the original durable plan. Keep operator output compact: status/count/hash/path, brief fields and exact terminal orders only; full candidates, account tables, source caches and payloads stay in artifacts. Report terminal orders/fills/UNKNOWN, Book-B cash/NAV, supporting degradation and preflight/ACK/reconciliation durations. Record cause, repair, validation and deployment SHA in Automation memory.\n\nOn a blocked result, follow book-b-live-repair.md through local repair and exact-plan readback before closeout. Inspect pending_orders and incident_notifications in the terminal notice; report the exact existing WeCom delivery time/status, never equate no new orders with no alert. Prior-day reconciliation refreshes historical queries but cannot infer cancellation from age, zero trades or unchanged holdings. Record any irreducible external terminal-evidence gap explicitly; a written next-owner note is not an accepted handoff.\n\nTask isolation and trading WeCom milestones: the runner owns the task-local automation ID xiaocao-book-b-live-morning and dated runner lock. Never use a remote-writer peer gate/ownership to suppress this task; report actual lock owner and exact failure. The runner durably records preflight-start and native APP preflight-ready locally; only its consolidated opening result is delivered automatically. Send failure causes on any blocked/failed result and exact order/fill results on success or no-action; early preflight blockage must explicitly say opening execution was not reached. Ready is native session/account evidence, not action-time quote/capital authority. Delivery runs asynchronously while trading; read the emitted book_b_wecom_delivery proof. After business work run PYTHONPATH=src .venv/bin/python scripts/morning_trade_notice.py --retry-pending once and report delivery time/status or remaining uncertainty. This retries only proven pre-send failures; never resend delivered recipients or uncertain claims automatically. --receipt <exact terminal receipt> sends only evidence and never restarts the trade. Never fabricate ready or a retrospective start.\n\nIf the original runner remains active at 09:30 without terminal proof, its built-in notification timer sends an explicit pending/unproved golden-window result without APP polling or stopping recovery; it sends the actual terminal result later. Read the dated delivery receipts and do not infer zero orders/fills from missing terminal evidence.\n\nTask identity contract: this Automation ID is exactly xiaocao-book-b-live-morning. Bind business commands to CODEX_AUTOMATION_ID=xiaocao-book-b-live-morning and retain the runtime-supplied CODEX_THREAD_ID; compare against this task's initial scheduler header, and stop a mismatched entrypoint before effects. Do not infer identity or ownership from task title, shared project/cwd, Git branch, copied prompts or another automation's runner/receipt. Duplicate task/slot gates match only this exact Automation ID and include it in lock keys and owner evidence. Account/ledger/order resource guards keep their existing economic scope; never bypass them. A KOL peer gate may suppress only the KOL writer with the same ID. Time-critical first-command requirements remain in force; identity binding is an environment prefix on that existing command, not a new discovery step.\n\nPreflight recovery contract: on dependency_recovery_wait, the original runner remains alive. Read only its exact request_path and sanitized health, repair the local dependency immediately, then run PYTHONPATH=src .venv/bin/python scripts/morning_preflight_recovery.py --request <exact request_path> once from the same task identity. Consume dependency_recovered or the next wait event; a signal never certifies ready. Only exact pre-secret not_attempted failures with no user-only dependency retry every two seconds; ordinary readiness remains quiet until09:24; never replace it or turn this wait into a terminal blocked result. The initial helper build, preflight, pre-freeze heartbeat recovery and freeze wait share the original 2100-second preparation budget. Native helper repairs can be adopted by source hash; Python changes are not presumed hot-loaded. An unproved password attempt is durably fenced across processes until account-bound readiness is observed; preserve remaining-attempt uncertainty and never repeat that attempt. Before password replacement the helper handles only an account-matched known login-success notice or a uniquely known stale password-error sheet with explicit attempted=false and confirm_pressed=false, proves disappearance and binds the same unlock target again. Prior confirmed/uncertain attempts remain fenced. The runner records recoverable preflight problems locally; an explicit user-only dependency may notify immediately, with delivery proof. A terminal preflight result after exhaustion still requires the exact receipt alert and bounded repair under book-b-live-repair.md.\n\nBefore every native operation batch, perform the account-bound dialog check; check again before each order preparation. Dismiss only a uniquely account-matched known login-success notice, or the exactly proved pre-secret stale password-error sheet described above, and prove it gone. Distinguish macOS titlebar control windows only with exact control and parent-window geometry evidence. A helper-proved pre-secret failure with explicit attempted=false and confirm_pressed=false is not_attempted: repair the local dependency and recheck the same original runner. Missing evidence, interrupted claims or possible confirmation remain durably fenced; never infer no action from a status name alone. This implements the user's 2026-09-29 instruction to check dialogs before batch operations.\n\nAPP Book B capital/accounting: apply Operating Contract §6 and docs/BOOK_B_ACCOUNTING.md after the time-critical first command. All account-bound available cash is deployable; size with dynamic strategy NAV and existing ratios, with buy notional including fees capped by fresh available cash. Consume account.accounting and its exact observation/journal/funding hashes from the shared accounting.sqlite3; report marked NAV, contributed capital, realized/unrealized PnL and separate estimated-exit-fee/risk NAV. Unclassified cash stays pending and total PnL is N/A; never infer capital from balance differences or reset high water/pause. Keep original order evidence, manual holdings and paper A/B/T separate. Routine tasks never classify new capital, mint authorization, resize existing intents or replace a runner.\n\nOriginal-batch consumption contract (Operating Contract §1c, v4.32): consume the producer's committed execution bundle through shared morning_bundle validation; revalidate date/run/strategy/canonical and raw hashes/count plus original checkpoint at use, adopting only a proved same-content immutable recovery copy. Formal paper never falls back to mutable signal_snapshots.jsonl; isolated legacy flags are forbidden in Automation. A completed terminal paper no-buy/APP intent is never replayed. On morning_bundle_repair_required read the exact request_path, repair the local dependency and run PYTHONPATH=src .venv/bin/python scripts/morning_bundle_recovery.py --request <exact request_path> once with this exact task identity; keep original wait and budget alive. A signal is not ready. Preserve failed/conflicting original files, account and order locks, claims and UNKNOWN reconciliation. Optional human report/review queue is derived support; explicit intelligence-trade on requires completed same-batch support and current high-risk veto. Quote/account/market/capital and §2a gates remain independent. Scheduler token unavailable remains explicit.\n\nNo-effect preflight continuation: if the original process has already terminated blocked at preflight with zero plans, preparations and execution receipts, its same dated Automation/Thread owner may use --resume-preflight-receipt <exact runs/history receipt> on scripts/book_b_live_morning.py to continue the original committed producer bundle. The entry validates canonical archive/state/date/owner, preserves the recorded original preparation budget and durably claims one continuation before native actions. A legacy receipt missing its budget/deadline requires --original-preparation-budget-seconds <proved original budget> and --original-preparation-deadline <proved aware original absolute deadline>; never assume or reset it, or refund wrapper setup time. Completed/no_action outcomes, existing current-date BUY intents and consumed/interrupted continuation claims reject this entry. Use exact-plan recovery for materialized intents. Fresh exact zero-fill prior-day SELL proofs may be reused without redundant historical queries; UNKNOWN, same-code BUY fences and every account/cash/quote/market/risk/order guard remain. Never restart the producer or replay a terminal no-action."
