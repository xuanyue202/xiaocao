prompt = "Use the local xiaocao-trading skill, references/automation-morning.md, references/kol-trading-judgment.md, references/kol-source-preparation.md and Operating Contract §1a/§1b/§2a. This is Book B APP-server simulation with formal execution/receipt discipline, separate from local paper ledgers.\n\nAt 09:00 China time immediately start exactly one original runner with short yield: `PYTHONPATH=src .venv/bin/python scripts/book_b_live_morning.py --date today --route native-app`. Preserve that process and its default 2100-second freeze wait. In parallel run exactly one lightweight authentication probe: `PYTHONPATH=src .venv/bin/python scripts/market_data_preflight.py --date today --scope authentication`. A successful empty response proves neither candidates nor complete data, and is not an authentication failure. Diagnose explicit 990502 through the existing Keychain-backed official login recovery; never print credentials or mint capital authorization. Use full core probes only for a concrete affected-endpoint diagnosis. The 09:23 producer independently owns current data readiness and the immutable freeze; do not run it here.\n\nEarly preparation must finish the expensive source reasoning before freeze; fetching a source packet alone is not readiness. Obtain cache-only context with `kol_trading_context.py context --summary --cache-only --history-fresh-through <today>T09:30:00+08:00`. Run `kol_trading_preparation.py status --context <context_path>`. Refresh returned exact report IDs in bounded batches, retaining the same history horizon until registered_longitudinal_complete is true; preserve unresolved gaps. A source_revalidation_required result supplies reusable_path: it means missing cache evidence, not changed source semantics. Reuse unchanged independently reviewed notes and compare exact source/record hashes; never declare a full base context read solely from reading its preparation notes. Source extraction and per-object source handoff belong to the sole remote writer. For genuinely new or changed evidence without a matching packet, begin its complete reading and independent source review early without starting another KOL writer or business sweep.\n\nAfter the original native preflight succeeds, leave the App untouched until 09:24 China time. The same runner sleeps without native heartbeats or repeated freeze polling before 09:24, then immediately rechecks/recovers the session and resumes its 30-second heartbeat near the freeze. Do not add manual keepalive calls while it sleeps. As soon as the complete relevant sources/preparation are ready, start one retained gpt-6-astra xhigh semantic worker with accepted dispatch evidence; the parent reads independently in parallel. Finish source reasoning, conflicts, conditional applicability and draft structure early, marking unobserved opening facts pending. Then sleep in bounded intervals while retaining that worker; do not defer its first dispatch to 09:22 or the freeze. Do not repeatedly query accounts, refresh all history, run core market probes or spawn duplicate semantic analyses while waiting. Near 09:22 refresh selected source manifests and read only complete new/changed evidence. After an exact full context has actually been read, --since-context may supply its lossless delta; a new semantic worker needs both base and delta. Retain context_path for formal decision publication. Resume active runner polling by 09:24:50.\n\nAt the 09:25 freeze, reuse a still-valid applicable published decision when available. Otherwise give the already-running semantic worker the exact runner review request, immutable candidates, its hash-bound account/allocation and risk inputs, current market facts and counterevidence. Finish applicability and independent parent review. Use the supplied account evidence rather than duplicating its read after the review timer starts. Publish only through scripts/kol_trading_decision.py. A source packet has authority=0; it cannot substitute for current applicability, complete formal source coverage or fresh execution gates. Do not re-extract unchanged sources, fabricate neutral approval, extend a decision merely for timestamp freshness, or restore mode eligibility without the approved exact-source v2 proof. The final rendezvous is at most 120 seconds, capped at 09:27 before opening to reserve native batch-submission time; preserve its exact deadline and terminal fallback receipt; never backdate a late decision or rerun a terminated morning to alter its outcome.\n\nUse only the dated immutable freeze and fresh account-bound allocation. Native App/project AX code owns all execution; no OpenCLI trading/view or agent-operated order form. Do not run/wait for morning-execute, read/write local paper fills or canonical paper accounts, or regenerate frozen candidates. Read recommend_source_readiness_<date>.json and retain incomplete coverage explicitly. No executable ★E is a normal strategy outcome.\n\nDuring 09:25–09:30, unexpected AX/project failures trigger minimum necessary repair/validation and exact same-plan continuation under references/book-b-live-repair.md. The user confirms APP counter queue submission is available from 09:25. Target the whole approved batch before 09:28 and require submission before 09:30; this means unique counter order acceptance, not prepare or fill. Record missing or late acceptance as a timing failure and continue exact-plan repair; never turn the target into automatic skip. Mapped chain-certain ACK/PARTIAL must not wait for fills before the next reserved plan; UNKNOWN stops new writes. Read submission_observations and preserve raw queued/accepted/fill states separately. Preserve strategy, allocation, time/market guards, zero exact-tuple baseline, one durable claim, unique new order-id mapping and order-bound fill evidence. UNKNOWN or any possible write is reconcile-only. Use --resume-plan-id with --recovery-action resume|reconcile|close only for the exact durable plan; never revive terminal plans, repeat uncertain writes, or reallocate old intents. If orders remain pending, retain explicit ownership and reconcile every pending exact plan in bounded rounds; one resting order must not strand other approved unsubmitted intents. Record an explicit handoff if a subsequent checkpoint takes over. Finish terminal readback first, then scoped regression, packaging, commit/push and root-cause report.\n\nReport concise Chinese actual execution, Book B cash/equity, terminal receipt, exact blocker and material delay. Keep mixed broker assets separate from Book B NAV; keep APP service receipts separate from paper results. Record cause/fix/verification and any remaining supporting degradation in the Automation memory."
