d retain incomplete coverage explicitly. No executable ★E is a normal strategy outcome.\n\nDuring 09:25–09:30, unexpected AX/project failures trigger minimum necessary repair/validation and exact same-plan continuation under references/book-b-live-repair.md. 09:30 is the submit floor, not an abandonment cutoff. Preserve strategy, allocation, time/market guards, zero exact-tuple baseline, one durable claim, unique new order-id mapping and order-bound fill evidence. UNKNOWN or any possible write is reconcile-only. Use --resume-plan-id with --recovery-action resume|reconcile|close only for the exact durable plan; never revive terminal plans, repeat uncertain writes, or reallocate old intents. Finish terminal readback first, then scoped regression, packaging, commit/push and root-cause report.\n\nReport concise Chinese actual execution, Book B cash/equity, terminal receipt, exact blocker and material delay. Keep mixed broker assets separate from Book B NAV; keep APP service receipts separate from paper results. Record cause/fix/verification and any remaining supporting degradation in the Automation memory."
