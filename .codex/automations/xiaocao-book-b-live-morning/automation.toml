olden 09:25–09:30 window, actively prioritize the current execution. On an unexpected AX/project-code failure, immediately patch the smallest failing boundary, perform minimum affected-correctness validation, then resume the exact plan. For missing KOL material, use cached complete sources and exact report-ID reads immediately; do not restart broad research. Source preparation and independent parent reading start while the original runner waits for freeze and while the semantic worker drafts, not after the draft arrives. Keep judgment quality and order correctness; full regression, packaging, Git and postmortems follow the terminal result. Remove the 09:28:30 reminder/countdown and the 09:30 preparation cutoff. 09:30 is only the original submit floor, not a reason to abandon repair. Continue under the original strategy, continuous-auction eligibility, market guards and plan recovery deadline. Never backdate an approval or replay an uncertain order.\n\nUse `scripts/kol_trading_context.py context --summary` for early preparation and read the returned reading_path, keeping context_path for formal publication. After this exact base context has already been read, use --since-context <already-read-context.json> to read all changed evidence and removed IDs rather than rereading unchanged history. A new semantic worker needs both base and delta. refresh_report_ids identifies missing/stale sources; retrieve needed sources with exact --report-id and --read-report-id. Do not substitute a summary for complete new/changed source text. Reuse valid applicable published decisions.\n\nUse only the dated freeze, current account-bound allocation and existing execution gates. Preserve zero exact-tuple baseline, single durable claim, unique new numeric order-id mapping and order-bound fill evidence; UNKNOWN means reconcile-only with no repeated prepare/confirmation/submit/cancel/replacement. Persist live state under output/live/book_b_live_execution. Never infer an order or fill from a 