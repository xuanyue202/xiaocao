prompt = "Use the local xiaocao-trading skill and read automation-morning.md, kol-trading-judgment.md, book-b-live-repair.md and Operating Contract §1a/§1b/§1c/§2a. Book B uses APP-server simulation with formal order, exact-once and accounting discipline; paper ledgers stay separate.\n\nAt 09:00 China time start exactly one original runner with short yield: PYTHONPATH=src .venv/bin/python scripts/book_b_live_morning.py --date today --route native-app. Retain its default quiet freeze wait and run one authentication-only market-data probe. On MARKET_LOGIN_CAPTCHA_REQUIRED, keep the original runner waiting and immediately start PYTHONPATH=src .venv/bin/python scripts/configure_market_data_auth.py --captcha-from-keychain in a PTY with short yield. It emits a temporary captcha_image_path and waits up to 120 seconds. Read the image with view_image, enlarge locally if ambiguous, then send one visually verified code through write_stdin; OCR is advisory only. The script uses saved Keychain credentials and the same HTTP session for challenge and login, and deletes the image. Do not ask the user to solve the image, expose credentials, or retry a rejected login. After successful Keychain readback, run one fresh-process authentication probe and accept only a valid immutable producer freeze. Missing saved credentials, SMS/consent or an unproved login remains a reported blocker. The 09:23 producer owns the immutable freeze; never start or wait for paper morning-execute. Treat runner stage JSON as the event source: do not model-poll, repeatedly call write_stdin, or print unchanged state before an emitted event or the 09:24 recovery boundary. Read brief_path first and select fields from immutable artifacts only when an event requires action.\n\nLiangHui viewpoint, viewpoint_evaluation and viewpoint_relation records are the sole KOL semantic SSOT. Build the cache-only, 11:30-horizon capsule with PYTHONPATH=src .venv/bin/python scripts/kol_trading_context.py projection --cache-only --history-fresh-through <today>T11:30:00+08:00. Consume its projection_path/projection_sha256/source_fingerprint/counts directly; use only a changed source_fingerprint as a semantic-change signal. Use every active_viewpoint that independently passes the typed, still-valid Book-B short-term standard; there is no fixed count or latest-N cutoff. Uncertain, non-short, unclassified and incomplete views are counts only. Never open classification_backfill or infer scope from keywords, holdings, asset names or latest-N. Do not run source preparation, create a second source summary, or reopen unchanged report bodies. Missing or degraded longitudinal coverage is a remote-writer quality issue and degrades to the deterministic baseline. At the freeze, one bounded current-applicability review may combine this compact projection with exact freeze, account, risk and current facts; formal publication loads only the cited exact report bodies for verification. Never extend freshness, backdate or force neutral.\n\nAttempt a guarded native unlock only when the credential source and remaining-attempt evidence are safe. The helper must clear and prove the secure field empty before replacement, submit once, and persist only sanitized credential health or failure category plus remaining attempts. Any unproved result is terminal for that attempt. Normal new BUY uses scoped available cash, owned Book-B lot marks, settled capital/ownership evidence, one bounded batch preflight and per-order guards. Preserve account, cash, price, quantity, market/strategy guard, duplicate tuple, durable claim and unique counter ACK. Continue after each chain-certain ACK/PARTIAL; UNKNOWN is reconcile-only.\n\nBefore any engineering APP test command, run PYTHONPATH=src .venv/bin/python scripts/app_test_window_status.py. A closed result defers tests without pytest collection; it never affects production repair or reconciliation. On faults follow book-b-live-repair.md and narrow-resume only the original durable plan