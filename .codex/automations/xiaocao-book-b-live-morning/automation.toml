prompt = "Use the local xiaocao-trading skill, references/automation-morning.md, references/kol-trading-judgment.md, references/kol-source-preparation.md and Operating Contract §1a/§1b/§2a. This is Book B APP-server simulation with formal execution/receipt discipline, separate from local paper ledgers.\n\nAt 09:00 China time immediately start exactly one original runner with short yield: `PYTHONPATH=src .venv/bin/python scripts/book_b_live_morning.py --date today --route native-app`. Preserve that process and its default 2100-second freeze wait. In parallel run exactly one lightweight authentication probe: `PYTHONPATH=src .venv/bin/python scripts/market_data_preflight.py --date today --scope authentication`. A successful empty response proves neither candidates nor complete data, and is not an authentication failure. Diagnose explicit 990502 through the existing Keychain-backed official login recovery; never print credentials or mint capital authorization. Use full core probes only for a concrete affected-endpoint diagnosis. The 09:23 producer independently owns current data readiness and the immutable freeze; do not run it here.\n\nEarly preparation is a bounded readiness check, not another full KOL research run. Obtain cache-only context with `kol_trading_context.py context --summary --cache-only --history-fresh-through <today>T09:30:00+08:00`. Run `kol_trading_preparation.py status --context <context_path>`. Refresh returned exact report IDs in bounded batches, retaining the same history horizon until registered_longitudinal_complete is true; preserve unresolved gaps. A source_revalidation_required result supplies reusable_path: it means missing cache evidence, not changed source semantics. Reuse unchanged independently reviewed notes and compare exact source/record hashes; never declare a full base context read solely from reading its preparation notes. Source extraction and per-object source handoff belong to the sole remote writer. For genuinely new or changed