prompt = "Use the local `xiaocao-trading` skill and read `automation-intraday.md` and `kol-trading-judgment.md`. First business command: `CODEX_AUTOMATION_ID=xiaocao-intraday-monitor-05 PYTHONPATH=src .venv/bin/python scripts/kol_trading_tick.py poll --monitor-paper-on-app-fence`. `no_op` ends silently. For `reconcile_required / RUNNING_CLAIM`, read the returned owner task once; an active owner ends this duplicate. Never clear a claim by age or repeat an unknown effect.\n\nOn `run`, retain exact token/fingerprints, run paper Book B once, then the live sparse checkpoint once, and reconcile both receipts. If `need_semantic_review=false`, do no KOL work. If true, consume the LiangHui semantic SSOT through `PYTHONPATH=src .venv/bin/python scripts/kol_trading_context.py projection --cache-only`; use only projection_path/projection_sha256/source_fingerprint/counts, treat only a changed source_fingerprint as a semantic change, and use every active_viewpoint that independently passes the typed, still-valid Book-B short-term standard; there is no fixed count or latest-N cutoff. Uncertain, non-short, unclassified and incomplete views are counts only; never open classification_backfill or infer scope from keywords, holdings, asset names or latest-N. Do not create source-preparation notes or reopen unchanged report bodies. A degraded projection degrades this tick and remains remote-writer work. One bounded current-applicability review may combine the compact projection with facts for runtimes actually checked; formal publication loads only cited exact report bodies.\n\nAck `completed|degraded` only after both branches and authorized support are terminal. Keep output compact, stay quiet on unchanged state, and preserve deferred BUY ownership and every UNKNOWN/reconcile boundary.\n\nIf the poll returns EXISTING_LIVE_PLAN_REQUIRES_OWNER, use its exact plan_ids/state_dir for one bounded durable receipt/event read under book-b-live-repair.md. Missing legacy owner identity is explicit, not permission to wait on an unnamed task or clear the plan. The original poll flag may already have run a separately claimed independent Paper checkpoint; consume paper_checkpoint_path and checkpoint_coverage and never run it again. APP remains blocked, no KOL tick claim/ACK, semantic work or funded research. Only this exact EXISTING_LIVE_PLAN_REQUIRES_OWNER branch permits the script-owned independent Paper check; other stop rules remain unchanged. Only exact-plan proved recovery may continue; UNKNOWN is reconcile-only. Record any external terminal-evidence gap.\n\nTask identity contract: this Automation ID is exactly xiaocao-intraday-monitor-05. Bind business commands to CODEX_AUTOMATION_ID=xiaocao-intraday-monitor-05 and retain the runtime-supplied CODEX_THREAD_ID; compare against this task's initial scheduler header, and stop a mismatched entrypoint before effects. Do not infer identity or ownership from task title, shared project/cwd, Git branch, copied prompts or another automation's runner/receipt. Duplicate task/slot gates match only this exact Automation ID and include it in lock keys and owner evidence. Account/ledger/order resource guards keep their existing economic scope; never bypass them. A KOL peer gate may suppress only the KOL writer with the same ID. Time-critical first-command requirements remain in force; identity binding is an environment prefix on that existing command, not a new discovery step.\n\nPrior-day SELL scope: on run, retain deferred_reconcile_plan_ids as exact unresolved order evidence and execute the current paper/live monitors once. Only the live consumer's fresh account/owned-lot/sellable/market checks may authorize a current exit. The tick does not reconcile or terminalize those old orders; current or future plans and active economic writer locks retain their existing fences.\n\nAPP Book B capital/accounting: apply Operating Contract §6 and docs/BOOK_B_ACCOUNTING.md after the time-critical first command. All account-bound available cash is deployable; size with dynamic strategy NAV and existing ratios, with buy notional including fees capped by fresh available cash. Consume account.accounting and its exact observation/journal/funding hashes from the shared accounting.sqlite3; report marked NAV, contributed capital, realized/unrealized PnL and separate estimated-exit-fee/risk NAV. Unclassified cash stays pending and total PnL is N/A; never infer capital from balance differences or reset high water/pause. Keep original order evidence, manual holdings and paper A/B/T separate. Routine tasks never classify new capital, mint authorization, resize existing intents or replace a runner.\n\n2026-10-22 approved unified APP B lifecycle: follow docs/BOOK_B_WORKFLOW.md. Retain APP E selection, the COLD default gate, B staged exits, current capital/risk and exact-once authority. Final-plan, execution and accounting receipts are separate. The independent app-b-forward-funded-v1 control and three pre-registered M/open-limit/no-KOL challenges are authority=0, each with its own 100,000 model-yuan cash/lots and future-window fills; model returns never establish APP fills or profit. Missing raw symbol/date/window/fee/mark evidence remains unknown. Canonical Paper A/B/T and the Book A sensor remain separate; no strategy promotion without research_run and the human gate.\nFor an owner-bound sparse checkpoint, after both original paper and APP business branches finish, run PYTHONPATH=src .venv/bin/python scripts/research_book_b_forward.py --phase monitor --checkpoint-phase sparse once, retaining that original phase even if late. OUTSIDE_SPARSE_CHECKPOINT, a poll/control-gate no_op, duplicate-owner, non-trading-day or rejected tick is terminal without research acquisition; retain the original ACK and claim discipline. A completed authorized business no_action or NO_OWNED_BOOK_B_LIVE_LOTS result still advances the independent model accounts.\n\nNative read failure evidence: follow the blocked receipt native_readback_evidence path and SHA-256 into runs/intraday/read_failures. Those retained redacted cells are diagnostic_only and are not a validated broker snapshot, fill, retry, BUY/NAV or settlement permission. A native_readback_evidence_error preserves the original failure and identifies a separate evidence-storage gap. Use references/book-b-live-repair.md; do not re-query an expired checkpoint to recreate its original cells.\n\n2026-10-29 monitoring evidence: opening/sparse entrypoints validate the exact initial scheduler header, inherited Automation/Thread and current China date before market, APP or Paper effects. Exact original archive plus plan hash supplies recorded owner provenance only, not a live lease or terminal order. A claimed/unproved independent Paper checkpoint is never cleared by age. Separate actual Paper coverage from APP blockage and KOL/research not-run; do not describe a gated slot as a completed full monitor."
