prompt = "Use the local `xiaocao-trading` skill/project conventions. At the 09:23 trigger, read only the minimum required local instructions and start `bash scripts/auto_daily.sh morning-prerecommend` immediately with a short yield; do not spend the opening window on analysis or commentary before starting the original producer. Run only that producer after minimal preflight. As soon as the dated recommendation and required same-run signal snapshots exist, report the pre-recommendation conclusion and return a final/inbox result before any agent review. Missing K/P cache is supporting-only and must not suppress ★E, but missing signal capture is a deterministic failure and must never be reported as a genuine ★E NONE. Do not consume the review queue and do not paper-record. Preserve immediate prerecommendation/freeze generation and delivery. The KOL §2a overlay is consumed by separate morning execution/live processes, never by changing this immutable recommendation. Do not add slow source/model work before producing the freeze.\n\nMarket-data authentication is wired into XiaocaoClient: read the dedicated macOS Keychain item xiaocao.market-data.session (account runtime), with an explicit XIAOCAO_API_TOKEN override only when intentionally supplied. Follow references/market-data.md. Never print/copy credentials into prompts, argv or artifacts. At 09:00 the separate preparation task runs scripts/market_data_preflight.py --date today, which bypasses cache and validates core pools/stock scores/smallGrass plus ranks. The 09:23 producer starts on schedule and consumes the same automatic credential provider; do not add duplicate broad probes before its freeze. Username/password are provisioned in the dedicated Keychain item xiaocao.market-data.credentials (account runtime). The official /user/v2/login protocol has been verified. XiaocaoClient reuses the cached token; after 990502 on official /stock/ reads it serializes one password login across processes and retries the original read once, with a 120-second login cooldown. Explicit environment overrides disable automatic login. Never print credentials or repeatedly attempt login. Missing credentials, repeated rejection, captcha/SMS or login failure is an authentication blocker requiring the documented local hidden-input recovery and fresh-process preflight, never an empty opportunity. Do not invent a refresh-token endpoint. A healthy preflight never authorizes a late refreeze or repeats a completed daily run."
