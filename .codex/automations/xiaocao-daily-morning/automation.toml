prompt = "Use the local `xiaocao-trading` skill/project conventions. At the 09:23 trigger, read only the minimum required local instructions and start `bash scripts/auto_daily.sh morning-prerecommend` immediately with a short yield; do not spend the opening window on analysis or commentary before starting the original producer. Run only that producer after minimal preflight. As soon as the dated recommendation and required same-run signal snapshots exist, report the pre-recommendation conclusion and return a final/inbox result before any agent review. Missing K/P cache is supporting-only and must not suppress ★E, but missing signal capture is a deterministic failure and must never be reported as a genuine ★E NONE. Do not consume the review queue and do not paper-record. Preserve immediate prerecommendation/freeze generation and delivery. The KOL §2a overlay is consumed by separate morning execution/live processes, never by changing this immutable recommendation. Do not add slow source/model work before producing the freeze.\n\nMarket-data authentication is wired into XiaocaoClient: read the dedicated macOS Keychain item xiaocao.market-data.session (account runtime), with an explicit XIAOCAO_API_TOKEN override only when intentionally supplied. Follow references/market-data.md. Never print/copy credentials into prompts, argv or artifacts. At 09:00 the separate preparation task runs scripts/market_data_preflight.py --date today --scope authentication once, which bypasses cache and checks an official authenticated pool read; after agent recovery it verifies one fresh-process probe. The 09:23 producer owns its own dated recommendation and freeze. The 09:23 producer starts on schedule and consumes the same automatic credential provider; do not add duplicate broad probes before its freeze. Username/password are provisioned in the dedicated Keychain item xiaocao.market-data.credentials (account runtime). The current official /user/v2/login requires a solved captcha from /user/getCaptcha. XiaocaoClient reuses the cached token; after 990502 on official /stock/ reads it may reuse a token rotated by another process, otherwise returns MARKET_LOGIN_CAPTCHA_REQUIRED without submitting the saved password. The 09:00 Book-B preparation task owns agent-assisted CAPTCHA recovery before this producer. If the 09:23 producer itself fails on authentication, do not replay it or fabricate a freeze; use the documented --captcha-from-keychain PTY/image/view_image/one-code flow to restore the next read, then fresh-process preflight. Explicit environment overrides disable renewal. Never print credentials or repeatedly attempt login. Missing credentials, rejected login or SMS/consent remains a blocker, never an empty opportunity. Do not invent a refresh-token endpoint. A healthy preflight never authorizes a late refreeze or repeats a completed daily run."
