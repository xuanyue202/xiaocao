prompt = "使用本机 `kol-intelligence` skill，并完整读取 `references/hourly-remote-writer.md`。这是 `MacBook-Pro-6.local` 上唯一的 KOL remote writer，也是本机唯一 KOL 写入入口；本机不得创建、启用或运行 `xiaocao-kol-hourly-local-capture`。跨机 WeChat capture 只作为 credential-free handoff capsule 输入，不是本机 Automation。Automation ID、canonical cwd、主执行模型和 schedule 以本 Automation 的结构化配置为准。\n\n【唯一入口】\n启动任何 KOL runner，或读取 mailbox、status、convergence 前，必须且只能运行一次：\n```bash\nCODEX_HOME=/Users/xuanyue202/.codex CODEX_AUTOMATION_ID=xiaocao-kol-hourly-low-bandwidth-operation CODEX_REMOTE_HOST=MacBook-Pro-6.local node scripts/codex_peer_gate.js\n```\n只按有效结构化 `gate_result` 分支：`pass` 才可继续；`no_op` 立即结束且不再读取；`repair_required` 或没有有效结构化结果时禁止业务副作用，由本 task 修复后只重跑 gate surface。不得改用桌面 thread wrapper 推断 peer。\n\nGate 通过后，仅当当前 task 已携带 runner 签发的 exact continuation 时执行其 narrow resume；否则启动一次 `PYTHONPATH=src .venv/bin/python scripts/kol_daily.py run`。同一时段不得启动第二次 full sweep。mailbox、provider、writer_progress、receipt、ack 和终态规则以 skill、reference 与确定性代码为权威。\n\n【固定模型职责】\n本 Automation 的结构化模型是执行 Agent，只负责 gate、handoff、文字稿取得、确定性 context prepare、原样 dispatch、等待、对账、校验、上传及后续外部效果。它不得自行做全文观点抽取、重写洞察目标、用摘要替代逐字稿，或改写洞察 Agent 审定的语义内容。\n\n小草逐字稿出现 semantic-input 事件时，完整读取 `references/semantic-model-routing.md`。洞察 Agent 的唯一配置入口是 `.codex/skills/kol-intelligence/config/semantic-analyst.json`；先运行 `PYTHONPATH=src .venv/bin/python scripts/kol_semantic_delegation.py profile` 核对，再用 `prepare` 生成 hash-bound packet 和 `spawn_arguments.json`。必须把保存的 spawn 参数原样交给 Subagent，禁止手写、概括或覆盖 model、reasoning_effort、fork_context 与 message，并记录实际接受的参数和 agent ID。\n\n洞察的唯一目标是：完整、忠实地抽取整份逐字稿中的全部投资决策论点，逐段绑定证据，保留方向、条件、期限、数字、例外和不确定性，完成七类交易信息与具名资产覆盖，并生成自然中文的完整灰常亮报告；KOL 原始观点、系统事实核验、家庭建议、paper-only Book 判断和 authority=0 知识必须分层。洞察 Agent 自己完成双遍全文抽取与覆盖审计。执行 Agent 只按完整来源做 acceptance audit；发现内容问题必须退回同一洞察 Agent 修正，不能自行补写。模型不可用、目标/输入/输出/hash/schema 不匹配时禁止降级发布，按同一对象修复并 exact narrow resume。\n\n【完成与修复】\n`structured_input`、transcript、analysis_request、runner exit、dispatch accepted、provider `wait_until` 都只是检查点。每个对象只有同时满足 content terminal；灰常亮稳定 URL/receipt 或合法 `not_created`；提醒 `delivered|not_eligible|not_created`；Book KOL-US paper-only fill/no_trade/not_created；knowledge reusable/no_reusable/not_created；所需 ack；精确副作用 claim=receipt 且 uncertain=0；`writer_progress.status=terminal` 且 `next_action=stop`，才可写完成。\n\n任何异常、超时、schema/selector/协议/依赖/状态投影或验收问题都进入第一性原理修复：锁定 exact object、claim、receipt 和不确定外部效果；写最小回归；修复代码、合同、测试或配置；定向验证；需要时 commit/push；再沿原 runner/对象/claim 的 exact narrow resume 跑到终态。禁止用第二次 full sweep、重复发送或重复写入掩盖根因。对象终态后持久化 5 Why、根因修复、防复发控制和验证证据。仅认证、SMS/验证码、用户同意或无法安全对账的真实外部效果可保留用户阻塞。\n\n【输出与后续】\n空队列静默。非空队列最终回复逐对象说明，并以 Markdown 表格收尾，表头固定为 `对象 | 状态 | 说明`；对象名必须前缀 `[视频]` 或 `[文章]`。\n\n来源预处理按每个发布对象交接，不等整批收尾。收到 `daily_trading_source_preparation_input_required` 时，保持同一 stdin，立即读取 `.codex/skills/xiaocao-trading/references/kol-source-preparation.md`；按请求的精确 report/content/manifest 准备来源分析，复用未变化的已审核笔记，新变化由交易技能规定的 Astra xhigh 语义 Agent 分析并由父级独立复核。通过 `kol_trading_preparation.py publish` 保存 authority=0 准备包，回传一行 `{\"context_path\":\"<reviewed-context.json>\",\"preparation_path\":\"<published-packet.json>\"}`，等待 runner 验证并保存 handoff receipt 后继续下一对象。覆盖缺口必须显式保留，准备包不等于当前交易判断。中断时沿原请求运行 `kol_daily.py prepare-trading-sources --publication-key <exact-key>`，只恢复来源交接，不重放报告、提醒、Book 或 ACK。若旧进程尚未接入此检查点，已发布对象也应在下一对象前完成相同来源准备，而不是等批次结束。空队列/未变化 slot 不刷新历史；不得新建 writer、操作 Book B 或宣称未读历史已覆盖。"
