prompt = "Use the local `xiaocao-trading` skill and `automation-intraday.md`. This opening-dense Automation is a protective-monitor owner only. Run `PYTHONPATH=src .venv/bin/python scripts/live_monitor.py --execute-sells` exactly once and wait for termination. Then run `PYTHONPATH=src .venv/bin/python scripts/book_b_live_intraday.py --date today --phase opening --execute-sells` exactly once. Keep paper and APP-server-simulation state separate; preserve broker-proved ownership, fresh positions/orders/trades/positions-funds, T+1, liquidity, capital-key, durable-claim, UNKNOWN/no-retry and soft-exit deferral rules. Follow the live repair reference for a non-normal result without rerunning the checkpoint.\n\nDo not retrieve KOL context, read KOL report bodies, run `kol_trading_preparation.py status`, dispatch a semantic Agent, refresh source identities, publish a KOL decision, or write under `output/live/kol_policy/analysis`. Morning source/decision changes remain pending for the 10:25 sparse claim owner. This task may only consume a KOL decision already validated before the checkpoint through the normal monitor consumer. After both commands terminate, perform bounded receipt/ledger readback and the single authorized post-business research checkpoint below, then finish; stay concise on a clean no-op.\n\nRepair priority (2026-09-27): prioritize each legal SELL window and the 09:25–09:30 BUY path. Normal readback uses full APP tables; treat an old prior-day UNKNOWN as its own reconciliation claim. Current account-bound APP sellable and a new dated owned-lot intent may permit a separate SELL, while independent lots continue. The dedicated sellable-only port is implemented and covered by offline and account-bound read-only acceptance. Use it only for the classified read failures and same-account/date/owned-lot/T+1/current-sellable gates in BOOK_B_WORKFLOW.md; it supplies no cash/NAV or EOD authority. Natural nonzero-lot/order acceptance remains unproved until observed; repair an actual failure, not an assumed missing port. After business, retry durable pending trading WeCom notices.\n\nTask identity contract: this Automation ID is exactly xiaocao-intraday-monitor. Bind business commands to CODEX_AUTOMATION_ID=xiaocao-intraday-monitor and retain the runtime-supplied CODEX_THREAD_ID; compare against this task's initial scheduler header, and stop a mismatched entrypoint before effects. Do not infer identity or ownership from task title, shared project/cwd, Git branch, copied prompts or another automation's runner/receipt. Duplicate task/slot gates match only this exact Automation ID and include it in lock keys and owner evidence. Account/ledger/order resource guards keep their existing economic scope; never bypass them. A KOL peer gate may suppress only the KOL writer with the same ID. Time-critical first-command requirements remain in force; identity binding is an environment prefix on that existing command, not a new discovery step.\n\nAPP Book B capital/accounting: apply Operating Contract §6 and docs/BOOK_B_ACCOUNTING.md after the time-critical first command. All account-bound available cash is deployable; size with dynamic strategy NAV and existing ratios, with buy notional including fees capped by fresh available cash. Consume account.accounting and its exact observation/journal/funding hashes from the shared accounting.sqlite3; report marked NAV, contributed capital, realized/unrealized PnL and separate estimated-exit-fee/risk NAV. Unclassified cash stays pending and total PnL is N/A; never infer capital from balance differences or reset high water/pause. Keep original order evidence, manual holdings and paper A/B/T separate. Routine tasks never classify new capital, mint authorization, resize existing intents or replace a runner.\n\n2026-10-22 approved unified APP B lifecycle: follow docs/BOOK_B_WORKFLOW.md. Retain APP E selection, the COLD default gate, B staged exits, current capital/risk and exact-once authority. Final-plan, execution and accounting receipts are separate. The independent app-b-forward-funded-v1 control and three pre-registered M/open-limit/no-KOL challenges are authority=0, each with its own 100,000 model-yuan cash/lots and future-window fills; model returns never establish APP fills or profit. Missing raw symbol/date/window/fee/mark evidence remains unknown. Canonical Paper A/B/T and the Book A sensor remain separate; no strategy promotion without research_run and the human gate.\nFor an authorized opening checkpoint, after both original paper and APP business branches finish, run PYTHONPATH=src .venv/bin/python scripts/research_book_b_forward.py --phase monitor --checkpoint-phase opening once, retaining that original phase even if late. A control-gate no-op, duplicate-owner, non-trading-day or rejected checkpoint remains terminal without research acquisition. A completed authorized business no_action or NO_OWNED_BOOK_B_LIVE_LOTS result still advances the independent model accounts."
