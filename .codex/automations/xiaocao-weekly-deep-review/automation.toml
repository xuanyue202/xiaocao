prompt = "At the start, run exactly once with a short yield in one retained PTY: PYTHONPATH=src .venv/bin/python scripts/kol_automation_slot_gate.py --automation-id xiaocao-weekly-deep-review --lock-dir output/live/weekly_deep_review_hour_locks -- /bin/bash scripts/auto_daily.sh weekly\nRead the first structured gate result. On hour_busy, end normally without any weekly business. On hour_acquired, keep the original PTY/process alive until its exec'd weekly command terminates; this is the sole weekly command invocation. Do not compute an RRULE slot or minute cutoff, inspect old Codex tasks/processes/terminals/runners/browsers, or start a second weekly command. After the terminal command, continue the existing plan review, validation and finalization from its artifacts.\n\nUse the local `xiaocao-trading` skill/project conventions. Run the Xiaocao weekly deep review workflow: build the fixed-input plan, apply only evidence-backed AUTO_APPLIED changes when the plan permits, otherwise create explicit proposals, run validation, then finalize the weekly report/ledger/current-branch commit according to the skill's weekly workflow instructions. Read the local trading reference `.codex/skills/xiaocao-trading/references/kol-trading-judgment.md` for the user-approved Operating Contract §2a bounded KOL interface and shared account-risk policy. Keep this Automation's model; delegate only semantic judgment to `gpt-6-sol` with `xhigh`, save the accepted dispatch and provide complete source/current decision context, then independently review the full relevant evidence before publishing through `scripts/kol_trading_decision.py publish`. Only a validated v2 kol-xiaocao explicit mode-follow may precede normal mode rotation inside the same-day frozen Book-B candidate set; it may restore COLD but never UNKNOWN, BJSE, a non-frozen code, capital keys, the frozen capsule, or an existing durable intent. No new capital/leverage or live order is authorized by this prompt. The weekly plan now includes kol_system_review. Treat this as a higher-level framework review, not concatenated KOL headlines: review this week plus 4/12-week evidence where available; overall outcomes, missed upside, capital use, drawdown, costs and execution loss; source conflicts/correlation, interpretation/timing errors and over-filtered opportunities. Have Sol xhigh challenge at least the no-KOL baseline, current bounded overlay and a plausible challenger using the full fixed-input plan, prior weekly hypotheses and failures. Independently review. Follow up prior experiments and choose at most three concrete adjustments/experiments with objective, falsifier, evidence requirement, owner, rollback and next review. Sparse samples are not causal profit proof. Keep fixed-input AUTO_APPLIED vs PROPOSAL_ONLY, dirty-target and research-evidence gates. Evidence-backed APP-simulation strategy, capital-permission, permanent-parameter and safety changes may be committed without waiting for a reply, but must enqueue and attempt an explicit trading WeCom change notice; keep undelivered notices pending and retry after business. Real-capital actions still require the two-key gate. Framework prose alone never promotes a change.\n\nBefore the strategy/KOL framework review, inspect the plan's execution_repair_watch and its hash-bound daily reports, live order events, closing/EOD receipts and settlements. For each open SELL, blocked close/EOD or missing settlement, analyze exact order/fill/holding proof, price versus available bid and later trades, remaining auction time, same-day lot coverage, and next-morning BUY/NAV/risk impact. A broker UNKNOWN can stay reconcile_only while an independent pricing, timing or overbroad guard defect requires repair. Compare repeated fingerprints and prior repair claims across days; distinguish code changed, tests passed and natural production verified. Name exactly one active repair owner. If none exists, own a narrow deterministic operational code/config repair under book-b-live-repair.md, validate, commit/push and verify at the next legal run; do not send broker orders or replay expired checkpoints. This operational incident lane is separate from strategy AUTO_APPLIED/PROPOSAL_ONLY and permanent-promotion gates.\n\nFor every execution_repair_watch anomaly, inspect at least the first failed and latest affected daily/closing/morning task traces: exact tool outputs, errors, times, archived receipts, durable event/ownership records, and broker or paper effects. Challenge previous agents' final summaries and daily reviews; a model label or exit 0 is not evidence of resolution. Trace repeated incidents across days, write a 5 Why separating external order uncertainty from pricing/timing/scope defects and next-session effects, and verify code repair, tests and production readback independently. Check failed scheduled turns before attributing late shell start to scheduling.\n\nOperational correction: rank repair by legal trading-window opportunity loss and actual prerequisites. A previous weekly report called the cross-day same-lot fence a fix; verify against Sep 23 independent current-sellable/new-order fill and keep the old UNKNOWN separate. Both full-account and classified sellable-only paths are implemented. Distinguish code/offline and account-bound read-only acceptance from still-unproved natural nonzero-lot/order acceptance; inspect the next original legal run and do not rebuild an assumed missing port. Do not spend this review re-investigating the user-owned Thu/Fri network repair.\n\nTask identity contract: this Automation ID is exactly xiaocao-weekly-deep-review. Bind business commands to CODEX_AUTOMATION_ID=xiaocao-weekly-deep-review and retain the runtime-supplied CODEX_THREAD_ID; compare against this task's initial scheduler header, and stop a mismatched entrypoint before effects. Do not infer identity or ownership from task title, shared project/cwd, Git branch, copied prompts or another automation's runner/receipt. Duplicate task/slot gates match only this exact Automation ID and include it in lock keys and owner evidence. Account/ledger/order resource guards keep their existing economic scope; never bypass them. A KOL peer gate may suppress only the KOL writer with the same ID. Time-critical first-command requirements remain in force; identity binding is an environment prefix on that existing command, not a new discovery step.\n\nAPP Book B capital/accounting: apply Operating Contract §6 and docs/BOOK_B_ACCOUNTING.md after the time-critical first command. All account-bound available cash is deployable; size with dynamic strategy NAV and existing ratios, with buy notional including fees capped by fresh available cash. Consume account.accounting and its exact observation/journal/funding hashes from the shared accounting.sqlite3; report marked NAV, contributed capital, realized/unrealized PnL and separate estimated-exit-fee/risk NAV. Unclassified cash stays pending and total PnL is N/A; never infer capital from balance differences or reset high water/pause. Keep original order evidence, manual holdings and paper A/B/T separate. Routine tasks never classify new capital, mint authorization, resize existing intents or replace a runner.\n\nRead the dated Book-B accounting_reports JSON/CSV as execution-review evidence; disclose mark time, unclassified cash and estimated fees. These reports do not grant strategy-promotion or order authority.\n\n2026-10-22 短线维护：原 weekly shell 在 plan 前刷新 research_shortline_comparison.py 的只读对照；读取 data_evidence_review.shortline_research 及冻结输入。按 docs/BOOK_B_WORKFLOW.md 区分严格同进场退出、筛选参与度、APP 执行损耗与 KOL 增量；保留空槽、缺标签、不可成交、费用、版本及样本外分母。选择集记录不是资金组合收益。沿已有 baseline_no_kol/current_bounded/kol_challenger 三槽维护证据和反证，优先验证 COLD 与空仓机会成本；APP 默认门保持，永久晋级仍走 §10，不另造重复试验或通知。\n\n2026-10-22 approved unified APP B lifecycle: follow docs/BOOK_B_WORKFLOW.md. Retain APP E selection, the COLD default gate, B staged exits, current capital/risk and exact-once authority. Final-plan, execution and accounting receipts are separate. The independent app-b-forward-funded-v1 control and three pre-registered M/open-limit/no-KOL challenges are authority=0, each with its own 100,000 model-yuan cash/lots and future-window fills; model returns never establish APP fills or profit. Missing raw symbol/date/window/fee/mark evidence remains unknown. Canonical Paper A/B/T and the Book A sensor remain separate; no strategy promotion without research_run and the human gate.\nThe weekly shell refreshes funded performance and APP lifecycle reports before immutable weekly inventory. Evaluate full funded paths, open lots, unknown orders, complete opportunity dates, same-frequency EOD NAV, costs and drawdown coverage. Keep selection-only and matched closed-trade diagnostics separate. Continue or falsify the three registered experiment IDs; daily returns cannot substitute for independent trade samples and no parameter is promoted automatically.\nRead calendar_coverage separately from report as_of. A refreshed report does not extend proved calendar coverage; an unobserved tail remains unknown even when known missing-date lists are empty. Never infer trading dates from weekdays or treat an old report as complete through this run.\n\nNative read failure evidence: follow the blocked receipt native_readback_evidence path and SHA-256 into runs/intraday/read_failures. Those retained redacted cells are diagnostic_only and are not a validated broker snapshot, fill, retry, BUY/NAV or settlement permission. A native_readback_evidence_error preserves the original failure and identifies a separate evidence-storage gap. Use references/book-b-live-repair.md; do not re-query an expired checkpoint to recreate its original cells. Weekly execution inventory treats .wait.json as budget evidence and .orders.json as order-progress evidence, retains orphaned waits as missing terminal receipts, and validates only canonical terminal checkpoints. A failed original plan remains failed; do not rerun the weekly shell or claim that a plan-ready log proves an artifact exists.\n\n2026-10-26 用户批准 EOD → Weekly 闭环：读 docs/EOD_WEEKLY_FEEDBACK.md 与计划 data_evidence_review.eod_feedback 的冻结日交接及原件副本。跨日归纳重复原因、修复教训、可用结论、有效实验样本和已登记设计偏离；不以日报结论替代原始失败/最近运行。逐项填写 eod_feedback_responses（id、disposition、rationale、冻结 evidence_refs、owner、next_action、next_review），输入缺口写 eod_feedback_gap_review。未完成项跨周保留；issue 未自然验证不得 close，测试/配置不等于生产验收。finalizer 强制覆盖并将 hash-bound eod_feedback_state 写入既有 flywheel_change_ledger，供下一 EOD 回读负责人和行动。沿用原三实验槽、research_run、§10 与原 AUTO_APPLIED 固定输入，不因每日交接扩权；stop_proposal 只是研究建议，不改变交易、账本或 UNKNOWN。跟进旧项后再决定集中研究/修正/停止建议/证据不足。\n\n2026-10-26 会话复核修正：冻结 prior Weekly 未决回复及各项原 daily receipt 引用，并与现存日交接交叉核对。新日原件缺失/损坏时保留 id、owner、下一行动和 evidence_gap，逐项回应并说明缺证；较早 verified 记录只作历史证据，不能关闭缺失的新未决事项。不得把缺文件当 no_records，不重建或改写原始日交接。"
