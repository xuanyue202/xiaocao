[pytest]
testpaths = tests
markers =
    app_authentication: authentication-only APP tests with no order or strategy ledger effects
    app_simulation: APP-specific regression/simulation; Asia/Shanghai weekends, or weekdays before 09:00, 11:30 <= time < 13:00, or from 15:00
    e2e: live end-to-end tests against the Xiaocao API
addopts = -ra
