[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaocao"
version = "0.1.0"
description = "Xiaocao stock data and strategy CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.28",
  "PyYAML>=6.0",
  "rfc8785==0.1.4",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# the data/ML layer (training_rows parquet, continuous_optimize, capture_signals) uses
# pandas/pyarrow. The core CLI + deterministic spine + live safety do NOT — flywheel.py reads
# parquet through a try/except that degrades to None — so these are OPTIONAL, declared here so a
# full env (`pip install -e .[data]`) runs the pandas-dependent tests instead of skipping them.
data = [
  "pandas>=2.0",
  "pyarrow>=12",
]
test = [
  "pytest>=8.0",
  "xiaocao[data]",
]

[project.scripts]
xiaocao = "xiaocao.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
