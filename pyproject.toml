[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaocao"
version = "0.1.0"
description = "Xiaocao stock data and strategy CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.28",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[project.scripts]
xiaocao = "xiaocao.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
